{% extends 'admin/change_list.html' %}

{% block extrahead %}
  {{ block.super }}
  <style>
    .note-card {
      display: flex;
      flex-direction: column;
      height: 380px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }
    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08) !important;
    }
    .note-card-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 1.25rem 1.25rem 0.75rem 1.25rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
      color: #2c3e50;
    }
    .note-card-body::-webkit-scrollbar {
      width: 6px;
    }
    .note-card-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .note-card-body::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
    }
    .note-card-body::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }
    .note-card-body h1,
    .note-card-body h2,
    .note-card-body h3,
    .note-card-body h4 {
      font-weight: 700;
      color: #1e293b;
      margin-top: 0;
      margin-bottom: 0.75rem;
      font-size: 1.25rem;
    }
    .note-card-body p,
    .note-card-body li {
      font-size: 0.925rem;
      line-height: 1.6;
    }
    .note-card-body ul,
    .note-card-body ol {
      padding-left: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .note-card-footer {
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.02);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
  </style>
{% endblock %}

{% block result_list %}
  <div class="row mb-4">
    {% for note in cl.result_list %}
      <div class="col-12 col-md-6 col-lg-4 mb-4">
        <div class="card shadow-sm note-card">
          <div class="note-card-body">
            {{ note.note|safe }}
          </div>
          <div class="note-card-footer">
            <a href="{{ note.pk }}/change/" class="btn btn-primary btn-sm shadow-sm mr-2">
              <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
            </a>
            <a href="{{ note.pk }}/delete/" class="btn btn-danger btn-sm shadow-sm">
              <i class="fa-solid fa-trash mr-1"></i> Delete
            </a>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12 text-center py-5">
        <div class="p-4 rounded bg-white border d-inline-block shadow-sm">
          <i class="fa-regular fa-note-sticky text-muted mb-2" style="font-size: 2.5rem;"></i>
          <p class="text-muted mb-0">No notes found. Create your first note above!</p>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
