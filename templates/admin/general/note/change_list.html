{% extends 'admin/change_list.html' %}

{% block result_list %}
  <div class="row g-4 mb-4">
    {% for note in cl.result_list %}
      <div class="col-12 col-md-6 col-lg-4 d-flex">
        <div class="note-grid-card w-100">
          <div>
            <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
              <span class="badge badge-primary">
                <i class="fa-solid fa-sticky-note me-1"></i> Note #{{ note.pk }}
              </span>
            </div>
            <div class="note-content-preview">
              {{ note.note|safe }}
            </div>
          </div>
          <div class="note-actions">
            <a href="{{ note.pk }}/change/" class="btn btn-primary btn-sm">
              <i class="fa-solid fa-pen-to-square"></i> Edit
            </a>
            <a href="{{ note.pk }}/delete/" class="btn btn-danger btn-sm">
              <i class="fa-solid fa-trash"></i> Delete
            </a>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12 text-center py-5">
        <div class="p-4 rounded bg-white border d-inline-block shadow-sm">
          <i class="fa-regular fa-note-sticky text-muted mb-2" style="font-size: 2.5rem;"></i>
          <p class="text-muted mb-0">No notes found. Create your first note above!</p>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
